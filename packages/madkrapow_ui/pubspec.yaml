name: madkrapow_ui
description: Shared Fiery Wok design system for the Mad Krapow Flutter apps.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.1
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
